<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="container">
      <div class="boxcon">
        <div class="output"></div> 
      </div>
        <div class="container-btn">
            <div class="btn">
                <button class="con">7</button>
            </div>
              <div class="btn">
                <button class="con">8</button>
            </div>
              <div class="btn">
                <button class="con">9</button>
            </div>
              <div class="btn">
                <button class="con">DEL</button>
            </div>
              <div class="btn">
                <button class="con">AC</button>
            </div>
              <div class="btn">
                <button class="con">4</button>
            </div>
              <div class="btn">
                <button class="con">5</button>
            </div>
              <div class="btn">
                <button class="con">6</button>
            </div>
              <div class="btn">
                <button class="con">x</button>
            </div>
              <div class="btn">
                <button class="con">/</button>
            </div>
              <div class="btn">
                <button class="con">1</button>
            </div>
              <div class="btn">
                <button class="con">2</button>
            </div>
              <div class="btn">
                <button class="con">3</button>
            </div>
              <div class="btn">
                <button class="con">-</button>
            </div>
              <div class="btn">
                <button class="con">0</button>
            </div>
              <div class="btn">
                <button class="con">.</button>
            </div>
              <div class="btn">
                <button class="con">+</button>
            </div>
              <div class="btn">
                <button class="con">Ans</button>
            </div>
              <div class="btn">
                <button class="con">( )</button>
            </div>
            <div class="btn">
              <button class="con">=</button>
            </div>
        </div>
    </div>
    <script src="calc.js"></script>
</body>
</html>
